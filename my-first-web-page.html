<!DOCTYPE html>
<!-- This tells the browser that this file uses HTML5. -->

<html lang="en">
<!-- This starts the HTML document and tells the browser the page is in English. -->

<head>
    <!-- This starts the head section, which contains information about the webpage. -->

    <meta charset="UTF-8">
    <!-- This sets the character encoding so text and symbols display correctly. -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- This makes the webpage display properly on phones, tablets, and computers. -->

    <title>My First Web Page</title>
    <!-- This sets the title that appears in the browser tab. -->

</head>
<!-- This ends the head section. -->

<body>
    <!-- This starts the body section, which contains the visible content of the webpage. -->

    <h1>My First Web Page</h1>
    <!-- This creates the main heading of the webpage. -->

    <p><strong>Username:</strong> pch</p>
    <!-- This displays your username. Replace "yourUCID" with your actual UCID. -->

    <p><strong>Course Name:</strong> Intro to Website Development</p>
    <!-- This displays the name of your course. Replace it with your actual course name. -->

    <p><strong>Course Number and Section:</strong> IS117-003</p>
    <!-- This displays your course number and section. Replace it with your actual course information. -->

    <footer>
        <!-- This starts the footer section at the bottom of the webpage. -->

        <p>&copy; 2026 Peter Huaynate | Due Date: October 6, 2026</p>
        <!-- This displays the copyright symbol, your name, and the assignment due date. -->

    </footer>
    <!-- This ends the footer section. -->

</body>
<!-- This ends the body section. -->

</html>
<!-- This ends the HTML document. -->
